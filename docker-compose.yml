services:
  mysql_db:
    image: mysql:8.0
    container_name: smart_ecommerce_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Lokesh@2001
      - MYSQL_DATABASE=smart_ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: smart_ecommerce_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:Lokesh%402001@mysql_db:3306/smart_ecommerce
      - JWT_SECRET_KEY=change_this_secret
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - AUTH0_DOMAIN=dev-w2ceyoa7ooqr3uep.us.auth0.com
      - AUTH0_CLIENT_ID=JPuZNoPRkcYjh01WLJoxRD9bwIhrFPfk
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  django_admin:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: smart_ecommerce_django
    ports:
      - "8002:8002"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-prod-key
      - DATABASE_URL=mysql://root:Lokesh%402001@mysql_db:3306/smart_ecommerce
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data: